[project]
name = "zlib-cli"
version = "0.1.0"
description = "Agent-friendly CLI for searching and downloading ebooks from Z-Library and Anna's Archive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["agent", "anna-archive", "cli", "ebook", "z-library"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
]

[project.urls]
Homepage = "https://github.com/soluna/zlib-cli"
Repository = "https://github.com/soluna/zlib-cli"
Issues = "https://github.com/soluna/zlib-cli/issues"
Changelog = "https://github.com/soluna/zlib-cli/blob/main/CHANGELOG.md"
Security = "https://github.com/soluna/zlib-cli/security/policy"

[project.scripts]
zlib-cli = "zlib_cli:main"

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "build>=1.2",
    "detect-secrets>=1.5",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools]
py-modules = ["zlib_cli", "Zlibrary", "annas_archive", "network_safety"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
